syntax = "proto3";
package slotgame.population;
option go_package = "server/pb;pb";

enum PopulationStatType {
 POPULATION_STAT_UNSPECIFIED = 0;
 POPULATION_STAT_ONLINE = 1;
 POPULATION_STAT_INGAME = 2;
}

// A complete session count, sent to admin while the reporting instance runs.
message PlayerPopulationReport {
 int32 game_type = 1;
 string instance_id = 2;
 int64 sampled_at = 3;
 int64 players = 4;
 int64 humans = 5;
 int64 robots = 6;
 PopulationStatType stat_type = 7;
}
