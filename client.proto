syntax = "proto3";

package slotgame.client;

option go_package = "server/pb;pb"; // 生成到 game/pb 目录。

// 仅保留本文件需要的服务组，数值与 egameserver 一致。
enum SrvGroup {
  ServerGroupVoid = 0; // 心跳主命令。
  ServerGroupGate = 10000; // 网关。
  ServerGroupLobby = 10001; // 大厅，登录请求的 mainCmd。
}

enum SubMSGKIND {
  SubMSGKIND_Unspecified = 0; // 心跳子命令。
  GateMSGLoginElsewhere = 1001; // 异地登录通知。
  LobbyMSGLogin = 2001; // 大厅登录，请求与响应使用相同子命令。
}

// 保持 egameserver 的成功码；其余错误码由认证服务约定。
enum LoginCode {
  LoginCode_Unspecified = 0; // 未指定，不代表旧协议登录成功。
  ErrorCodeTypeLoginSuccess = 200; // 登录成功。
}

message FrameMsg { // WebSocket 二进制消息的外层帧。
  int32 mainCmd = 1; // 主命令；大厅登录为 10001，心跳为 0。
  int32 subCmd = 2; // 子命令；大厅登录为 2001，心跳为 0。
  bytes buff = 3; // protobuf 序列化的业务请求或响应。
  int64 Time = 4; // 发送时间，兼容旧字段名；旧心跳响应使用 Unix 秒。
}

// 登录请求帧：FrameMsg{mainCmd:10001, subCmd:2001, buff:序列化 LoginRequest}。
message LoginRequest {
  int32 pid = 1; // 旧登录协议的 pid。
  int64 uid = 2; // 用户 ID。
  string token = 3; // 登录凭证，由下游认证服务验证。
  int32 gameId = 4; // 登录游戏标识；旧合包客户端传 10000。
}

// 登录响应帧使用相同 mainCmd/subCmd，buff 为序列化 LoginResponse。
message LoginResponse {
  string message = 1; // 响应说明；历史协议 message 在前，不可与 code 对调。
  int32 code = 2; // 结果码；旧登录成功为 200。
  int32 InGame = 3; // 兼容旧字段名：0 不在游戏，1 需要断线重连。
  int32 gameId = 4; // 游戏 ID。
  int32 matchGroup = 5; // 原协议匹配服务主命令。
  int32 roomGroup = 6; // 原协议房间服务主命令。
  int32 pushFriend = 7; // 原协议好友未读提示，0 无、1 有。
  int32 pushJackpotTask = 8; // 原协议 Jackpot 任务提示，0 无、1 有。
}

// Generic error payload, matching the old gate's common response layout.
message CommResp {
  int32 code = 1;
  string msg = 2;
}
